<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Navigation Bar */
        .navbar {
            background: linear-gradient(135deg, rgba(30, 30, 40, 0.98), rgba(50, 30, 70, 0.98));
            border-radius: 15px;
            padding: 18px 35px;
            margin-bottom: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-title {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
        }

        .navbar-menu {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .navbar-menu a,
        .navbar-menu button {
            padding: 10px 18px;
            color: #e0e0e0;
            text-decoration: none;
            border: 2px solid rgba(102, 126, 234, 0.3);
            background: rgba(102, 126, 234, 0.1);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 8px;
        }

        .navbar-menu a:hover,
        .navbar-menu button:hover {
            background: rgba(102, 126, 234, 0.3);
            color: #ffffff;
            border-color: rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .navbar-menu a.active,
        .navbar-menu button.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #ffffff;
            border-color: #667eea;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }

        /* Main Container */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(248, 249, 252, 0.98));
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
            border-bottom: 4px solid #667eea;
            padding-bottom: 25px;
        }

        .header h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 2px 4px rgba(102, 126, 234, 0.3));
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-refresh {
            background: linear-gradient(135deg, #00d084, #00b383);
            color: white;
            border: none;
        }

        .btn-refresh:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 208, 132, 0.4);
        }

        .btn-export {
            background: linear-gradient(135deg, #00d084, #00b383);
            color: white;
            border: none;
        }

        .btn-export:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 208, 132, 0.4);
        }

        .btn-edit {
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 8px 16px;
            font-size: 0.8rem;
            border: none;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
            padding: 8px 16px;
            font-size: 0.8rem;
            border: none;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            margin-bottom: 25px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border: 2px solid rgba(102, 126, 234, 0.15);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 700;
            border: none;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        td {
            padding: 18px 20px;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
            color: #333;
            font-weight: 500;
        }

        tbody tr {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
        }

        tbody tr:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08), rgba(118, 75, 162, 0.08));
            box-shadow: inset 0 0 15px rgba(102, 126, 234, 0.08);
        }

        tbody tr:nth-child(even) {
            background: linear-gradient(135deg, rgba(248, 249, 252, 1), rgba(245, 247, 252, 1));
        }

        /* Status Badge */
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .status-present {
            background: linear-gradient(135deg, #00d084, #00b383);
            color: white;
        }

        .status-absent {
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            color: white;
        }

        .status-late {
            background: linear-gradient(135deg, #ffa500, #ff8c00);
            color: white;
        }

        .status-leave {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Alert Message */
        .alert {
            padding: 18px 24px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
            font-weight: 600;
            border-left: 5px solid;
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from { 
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(0, 208, 132, 0.1), rgba(0, 179, 131, 0.1));
            color: #00a652;
            border-color: #00d084;
            box-shadow: 0 4px 15px rgba(0, 208, 132, 0.2);
        }

        .alert-error {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.1), rgba(238, 90, 90, 0.1));
            color: #d32f2f;
            border-color: #ff6b6b;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
        }

        .alert-info {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            color: #667eea;
            border-color: #667eea;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        /* Loading & Empty States */
        .loading,
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
            font-size: 1.1rem;
        }

        .spinner {
            border: 5px solid rgba(102, 126, 234, 0.2);
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        }

        /* Edit Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .modal-card {
            width: 95%;
            max-width: 560px;
            background: linear-gradient(135deg, #ffffff, #f8f9fc);
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            border: 1px solid rgba(102,126,234,0.2);
            overflow: hidden;
            animation: fadeInUp 0.4s ease-out;
        }

        .modal-header {
            padding: 16px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal-close {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .form-row {
            margin-bottom: 14px;
        }

        .form-row label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid rgba(102,126,234,0.25);
            background: #fff;
            font-size: 0.95rem;
        }

        .form-row textarea { min-height: 90px; resize: vertical; }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            padding: 16px 20px;
            border-top: 1px solid rgba(0,0,0,0.06);
        }

        .btn-cancel {
            background: rgba(102,126,234,0.15);
            color: #667eea;
        }

        .btn-save {
            background: linear-gradient(135deg, #00d084, #00b383);
            color: #fff;
        }
                /* Advanced Animations */
                @keyframes fadeInUp {
                    from {
                        opacity: 0;
                        transform: translateY(30px);
                    }
                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }

                @keyframes pulse {
                    0%, 100% { opacity: 1; }
                    50% { opacity: 0.7; }
                }

                @keyframes slideInRight {
                    from {
                        opacity: 0;
                        transform: translateX(50px);
                    }
                    to {
                        opacity: 1;
                        transform: translateX(0);
                    }
                }

                @keyframes glow {
                    0%, 100% {
                        box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
                    }
                    50% {
                        box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
                    }
                }

                /* Enhanced Container */
                .container {
                    animation: fadeInUp 0.6s ease-out;
                }

                .header {
                    animation: slideInRight 0.7s ease-out;
                }

                /* Smooth Table Row Animation */
                tbody tr {
                    animation: fadeInUp 0.5s ease-out;
                    animation-fill-mode: both;
                }

                tbody tr:nth-child(1) { animation-delay: 0.1s; }
                tbody tr:nth-child(2) { animation-delay: 0.2s; }
                tbody tr:nth-child(3) { animation-delay: 0.3s; }
                tbody tr:nth-child(4) { animation-delay: 0.4s; }
                tbody tr:nth-child(5) { animation-delay: 0.5s; }
                tbody tr:nth-child(n+6) { animation-delay: 0.6s; }

                /* Button Group Animation */
                .button-group {
                    animation: fadeInUp 0.6s ease-out 0.2s both;
                }

                /* Active Button Glow Effect */
                .navbar-menu a.active,
                .navbar-menu button.active {
                    animation: glow 2s ease-in-out infinite;
                }

                /* Header Icon Animation */
                .header-icon {
                    animation: slideInRight 0.7s ease-out 0.1s both;
                }

                /* Table Header Gradient Animation */
                thead {
                    animation: fadeInUp 0.5s ease-out;
                }

                /* Loading Spinner Animation Enhancement */
                .spinner {
                    animation: spin 1.2s linear infinite;
                    box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
                }

                /* Button Focus State */
                .btn:focus {
                    outline: none;
                    box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
                }

                /* Status Badge Pulse Animation */
                .status-badge {
                    animation: fadeInUp 0.4s ease-out;
                }

                /* Table Hover Shadow Effect */
                tbody tr:hover {
                    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.15);
                }

                /* Navbar Smooth Animation */
                .navbar {
                    animation: fadeInUp 0.5s ease-out;
                }

                /* Additional Hover Effects for Links */
                .navbar-menu a:active,
                .navbar-menu button:active {
                    transform: scale(0.98);
                }

                /* Text Gradient Effect */
                .header h1 {
                    animation: slideInRight 0.8s ease-out 0.15s both;
                    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                }

                .header h1:hover {
                    text-shadow: 0 0 20px rgba(102, 126, 234, 0.4);
                }

                /* Scrollbar Styling */
                ::-webkit-scrollbar {
                    width: 10px;
                    height: 10px;
                }

                ::-webkit-scrollbar-track {
                    background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
                    border-radius: 10px;
                }

                ::-webkit-scrollbar-thumb {
                    background: linear-gradient(135deg, #667eea, #764ba2);
                    border-radius: 10px;
                    box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
                }

                ::-webkit-scrollbar-thumb:hover {
                    background: linear-gradient(135deg, #764ba2, #667eea);
                    box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
                }

                /* Smooth Color Transition */
                .status-badge {
                    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                }

                .status-badge:hover {
                    transform: scale(1.05);
                    filter: brightness(1.1);
                }

                /* Table Cell Focus */
                table td {
                    transition: all 0.25s ease;
                }

                /* Subtle Background Shine Effect */
                .table-wrapper {
                    position: relative;
                    overflow: hidden;
                }

                .table-wrapper::before {
                    content: '';
                    position: absolute;
                    top: 0;
                    left: -100%;
                    width: 100%;
                    height: 100%;
                    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
                    animation: shine 3s infinite;
                    z-index: 0;
                    border-radius: 12px;
                    pointer-events: none;
                }

                @keyframes shine {
                    0% { left: -100%; }
                    100% { left: 100%; }
                }

                /* Button Ripple Effect */
                .btn {
                    position: relative;
                    overflow: hidden;
                }

                .btn::before {
                    content: '';
                    position: absolute;
                    top: 50%;
                    left: 50%;
                    width: 0;
                    height: 0;
                    border-radius: 50%;
                    background: rgba(255, 255, 255, 0.5);
                    transform: translate(-50%, -50%);
                    transition: width 0.6s, height 0.6s;
                    pointer-events: none;
                }

                .btn:active::before {
                    width: 300px;
                    height: 300px;
                }
        

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 1.6rem;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group .btn {
                width: 100%;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
                padding: 15px 25px;
            }

            .navbar-menu {
                width: 100%;
                justify-content: center;
            }

            table {
                font-size: 0.9rem;
            }

            th, td {
                padding: 12px 8px;
                font-size: 0.85rem;
            }

            .actions {
                flex-direction: column;
            }

            .actions .btn {
                width: 100%;
            }

            .btn {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="navbar-title">Face Detection Attendance System</div>
        <div class="navbar-menu">
            <a href="/mark-attendance">Mark Attendance</a>
            <a href="/register-face">Register Face</a>
            <a href="/attendance-record" class="active">Attendance Record</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/admin-login">Admin Login</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="header-icon">📋</span>
            <h1>Attendance Records</h1>
        </div>

        <!-- Alert Message -->
        <div id="alertBox" class="alert"></div>

        <!-- Button Group -->
        <div class="button-group">
            <button class="btn btn-refresh" onclick="refreshRecords()">🔄 REFRESH</button>
            <button class="btn btn-export" onclick="exportAsCSV()">📊 EXPORT AS CSV</button>
            <button class="btn btn-select-all" onclick="selectAllRecords()" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none;">☑️ SELECT ALL</button>
            <button class="btn btn-delete-all" onclick="deleteSelectedRecords()" style="background: linear-gradient(135deg, #ff6b6b, #ee5a5a); color: white; border: none;" id="deleteSelectedBtn" disabled>🗑️ DELETE SELECTED</button>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table id="attendanceTable">
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="selectAllCheckbox" onchange="toggleAll(this)"></th>
                        <th>Name</th>
                        <th>Timestamp</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4" class="loading">
                            <div class="spinner"></div>
                            <p>Loading records...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title">Edit Attendance Record</h3>
                <button class="modal-close" onclick="closeEditModal()">✖</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>Name</label>
                    <input id="editName" type="text" readonly>
                </div>
                <div class="form-row">
                    <label>Timestamp</label>
                    <input id="editTimestamp" type="text" placeholder="YYYY-MM-DD HH:MM:SS">
                </div>
                <div class="form-row">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="Present">Present</option>
                        <option value="Absent">Absent</option>
                        <option value="Late">Late</option>
                        <option value="Leave">Leave</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Notes</label>
                    <textarea id="editNotes" placeholder="Add notes (optional)"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeEditModal()">Cancel</button>
                <button id="saveEditBtn" class="btn btn-save" onclick="submitEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Cache of records for edit/delete
        let recordsCache = [];
        let currentEditId = null;
        let selectedRecords = new Set();
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadAttendanceRecords();
        });

        // Load attendance records
        async function loadAttendanceRecords() {
            try {
                const tbody = document.getElementById('tableBody');
                
                const response = await fetch('/api/attendance_list');
                const data = await response.json();

                if (data.success && data.data && data.data.length > 0) {
                    recordsCache = data.data;
                    displayRecords(recordsCache);
                    showAlert('Records loaded successfully', 'success');
                } else if (data.success && data.data && data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No attendance records found yet</td></tr>';
                    showAlert('No records available', 'info');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No attendance records found</td></tr>';
                    showAlert('Unable to load records', 'error');
                }
            } catch (error) {
                console.error('Error loading records:', error);
                document.getElementById('tableBody').innerHTML = 
                    '<tr><td colspan="4" class="empty-state">Error loading records. Please try again.</td></tr>';
                showAlert('Error loading records: ' + error.message, 'error');
            }
        }

        // Display records in table
        function displayRecords(records) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            selectedRecords.clear();

            records.forEach((record, index) => {
                const row = document.createElement('tr');
                
                const statusClass = `status-${record.status.toLowerCase()}`;
                const statusBadge = `<span class="status-badge ${statusClass}">${record.status}</span>`;
                
                const timestamp = record.timestamp || 'N/A';
                
                row.innerHTML = `
                    <td style="width: 40px;"><input type="checkbox" class="record-checkbox" data-id="${record.id}" onchange="updateDeleteButton()"></td>
                    <td>${record.name || 'Unknown'}</td>
                    <td>${timestamp}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-edit" onclick="editRecord(${record.id})">✏️ Edit</button>
                            <button class="btn btn-delete" onclick="deleteRecord(${record.id})">🗑️ Delete</button>
                        </div>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
            updateDeleteButton();
        }

        // Refresh records
        function refreshRecords() {
            loadAttendanceRecords();
        }

        // Edit record - open modal populated with data
        function editRecord(id) {
            const rec = recordsCache.find(r => r.id === id);
            if (!rec) {
                showAlert('Record not found', 'error');
                return;
            }
            currentEditId = id;
            document.getElementById('editName').value = rec.name || 'Unknown';
            document.getElementById('editTimestamp').value = rec.timestamp || '';
            document.getElementById('editStatus').value = rec.status || 'Present';
            document.getElementById('editNotes').value = rec.notes || '';

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            currentEditId = null;
            document.getElementById('editModal').style.display = 'none';
        }

        async function submitEdit() {
            if (!currentEditId) return;
            const saveBtn = document.getElementById('saveEditBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const payload = {
                status: document.getElementById('editStatus').value,
                notes: document.getElementById('editNotes').value,
                timestamp: document.getElementById('editTimestamp').value
            };

            try {
                const response = await fetch(`/api/update_attendance/${currentEditId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (data.success) {
                    showAlert('Record updated successfully', 'success');
                    closeEditModal();
                    loadAttendanceRecords();
                } else {
                    showAlert(data.message || 'Failed to update record', 'error');
                }
            } catch (error) {
                console.error('Error updating record:', error);
                showAlert('Error updating record: ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Changes';
            }
        }

        // Delete record
        async function deleteRecord(id) {
            if (!confirm('Are you sure you want to delete this record?')) {
                return;
            }

            try {
                const response = await fetch(`/api/delete_attendance/${id}` , {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ record_id: id })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Record deleted successfully', 'success');
                    loadAttendanceRecords();
                } else {
                    showAlert(data.message || 'Failed to delete record', 'error');
                }
            } catch (error) {
                console.error('Error deleting record:', error);
                showAlert('Error deleting record: ' + error.message, 'error');
            }
        }

        // Export as CSV
        function exportAsCSV() {
            const table = document.getElementById('attendanceTable');
            let csv = [];
            
            // Header
            csv.push('Name,Timestamp,Status');
            
            // Data rows
            const rows = table.getElementsByTagName('tbody')[0].getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                const cells = rows[i].getElementsByTagName('td');
                if (cells.length >= 4) {
                    const name = cells[1].textContent.trim();
                    const timestamp = cells[2].textContent.trim();
                    const status = cells[3].textContent.trim();
                    csv.push(`"${name}","${timestamp}","${status}"`);
                }
            }

            const csvContent = csv.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = 'attendance_records_' + new Date().toISOString().split('T')[0] + '.csv';
            link.click();
            
            showAlert('CSV exported successfully', 'success');
        }

        // Toggle all checkboxes
        function toggleAll(checkbox) {
            const checkboxes = document.querySelectorAll('.record-checkbox');
            checkboxes.forEach(cb => cb.checked = checkbox.checked);
            updateDeleteButton();
        }

        // Update delete button state
        function updateDeleteButton() {
            const checkboxes = document.querySelectorAll('.record-checkbox');
            const anyChecked = Array.from(checkboxes).some(cb => cb.checked);
            const deleteBtn = document.getElementById('deleteSelectedBtn');
            deleteBtn.disabled = !anyChecked;
            if (anyChecked) {
                deleteBtn.style.opacity = '1';
                deleteBtn.style.cursor = 'pointer';
            } else {
                deleteBtn.style.opacity = '0.5';
                deleteBtn.style.cursor = 'not-allowed';
            }
        }

        // Select all records
        function selectAllRecords() {
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            selectAllCheckbox.checked = true;
            const checkboxes = document.querySelectorAll('.record-checkbox');
            checkboxes.forEach(cb => cb.checked = true);
            updateDeleteButton();
            showAlert(`Selected ${checkboxes.length} record(s)`, 'info');
        }

        // Delete selected records
        async function deleteSelectedRecords() {
            const selectedCheckboxes = Array.from(document.querySelectorAll('.record-checkbox:checked'));
            
            if (selectedCheckboxes.length === 0) {
                showAlert('Please select records to delete', 'error');
                return;
            }

            const recordIds = selectedCheckboxes.map(cb => parseInt(cb.dataset.id));
            
            if (!confirm(`Are you sure you want to delete ${recordIds.length} record(s)? This action cannot be undone.`)) {
                return;
            }

            const deleteBtn = document.getElementById('deleteSelectedBtn');
            deleteBtn.disabled = true;
            deleteBtn.textContent = '⏳ Deleting...';

            let successCount = 0;
            let failureCount = 0;

            for (const recordId of recordIds) {
                try {
                    const response = await fetch(`/api/delete_attendance/${recordId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ record_id: recordId })
                    });

                    const data = await response.json();

                    if (data.success) {
                        successCount++;
                    } else {
                        failureCount++;
                    }
                } catch (error) {
                    console.error('Error deleting record:', error);
                    failureCount++;
                }
            }

            deleteBtn.disabled = false;
            deleteBtn.textContent = '🗑️ DELETE SELECTED';

            if (successCount > 0) {
                showAlert(`Successfully deleted ${successCount} record(s)${failureCount > 0 ? `, ${failureCount} failed` : ''}`, successCount === recordIds.length ? 'success' : 'info');
                loadAttendanceRecords();
            } else {
                showAlert('Failed to delete records', 'error');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type} show`;

            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
